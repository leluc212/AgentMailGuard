# A3_C6_minus_L3 — Ablation: đủ 5 lớp nhưng tắt L3 (chỉ chạy trên Qwen2.5-7B, 500 attack)
config_name: A3_C6_minus_L3
mode: enforce   # enforce = lớp được chặn thật; monitor = chỉ ghi cờ, không chặn
guard:
  l1_email_scanner: true
  l2_intent_extractor: true
  l3_channel_isolation: false
  l3b_doc_scanner: true
  l4_output_scanner: true
  l5_policy_engine: true
run:
  eval_set: eval_set_v1.jsonl
  temperature: 0
  seed: 42   # đổi thành seed nhóm chốt
  log_per_layer: true
