# C7_monitor — Chế độ giám sát: L1, L3b, L4, L5 chỉ ghi cờ, không chặn — để vẽ phễu & bảng chồng lấp
config_name: C7_monitor
mode: monitor   # enforce = lớp được chặn thật; monitor = chỉ ghi cờ, không chặn
guard:
  l1_email_scanner: true
  l2_intent_extractor: false
  l3_channel_isolation: false
  l3b_doc_scanner: true
  l4_output_scanner: true
  l5_policy_engine: true
run:
  eval_set: eval_set_v1.jsonl
  temperature: 0
  seed: 42   # đổi thành seed nhóm chốt
  log_per_layer: true
# L2, L3 là lớp biến đổi prompt (không có cờ pass/fail) nên tắt ở chế độ này.
# Agent chạy y như C0 → có thể chạy chung với C0 (C0 + bật log), không tốn thêm lượt.
