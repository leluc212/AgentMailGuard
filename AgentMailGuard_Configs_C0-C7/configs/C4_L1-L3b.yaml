# C4_L1-L3b — Thêm L3b Doc Scanner
config_name: C4_L1-L3b
mode: enforce   # enforce = lớp được chặn thật; monitor = chỉ ghi cờ, không chặn
guard:
  l1_email_scanner: true
  l2_intent_extractor: true
  l3_channel_isolation: true
  l3b_doc_scanner: true
  l4_output_scanner: false
  l5_policy_engine: false
run:
  eval_set: eval_set_v1.jsonl
  temperature: 0
  seed: 42   # đổi thành seed nhóm chốt
  log_per_layer: true
