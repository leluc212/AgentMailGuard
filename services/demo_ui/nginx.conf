# Demo console (ADR-0018 decision 1): the static build, and /v1 proxied to the API so the browser
# sees one origin and the API needs no CORS change. No login: compose binds 127.0.0.1 only.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve `api` per request through Docker's DNS: a recreated api container gets a new IP,
    # and a name resolved once at startup would answer 502 until demo-ui restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /v1/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
