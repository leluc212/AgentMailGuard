# Demo console (ADR-0018 decision 1): the static build, and /v1 proxied to the API so the browser
# sees one origin and the API needs no CORS change. No login: compose binds 127.0.0.1 only.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
