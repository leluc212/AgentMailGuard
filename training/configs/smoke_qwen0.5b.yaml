# Pipeline smoke test on CPU / small GPU: Qwen2.5-0.5B-Instruct, a handful of steps.
#   python -m training.finetune_llm_judge --config training/configs/smoke_qwen0.5b.yaml --max-steps 5 --limit 64
base_model: Qwen/Qwen2.5-0.5B-Instruct
output_dir: artifacts/lora/smoke-qwen0.5b
quantization: none
max_length: 1024
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
train:
  epochs: 1
  lr: 0.0002
  batch_size: 1
  grad_accum: 2
  warmup_ratio: 0.0
  logging_steps: 1
  eval_steps: 5
  save_steps: 5
