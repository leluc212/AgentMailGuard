# rag-email-owned guard model registry for the AgentMailGuard benchmark (task 7.19, ADR-0010).
# guard_factory.guard_settings passes this file's ABSOLUTE path as
# MailGuardSettings.guard_models.models_path, so the guard branch's configs/models.yaml is not
# edited. base_url and api_key are deliberately absent: the guard's OpenAIProvider then reads
# OPENAI_BASE_URL / OPENAI_API_KEY from the process env, which guard_env.guard_provider_env fills
# from rag-email's LLM__OPENAI_BASE_URL / LLM__OPENAI_API_KEY. The key never lands in a file.
# json_mode: json_object is the guard's default; switch to `none` only if `make mailguard-probe`
# shows the model's endpoint rejects it (the guard's parser tolerates fences).
models:
  gemma-4-26b-a4b-it:
    backend: openai
    model: gemma-4-26b-a4b-it
    json_mode: json_object
    timeout_s: 60
  # Owner decision 2026-09-29: the benchmark's three models. Endpoints and keys come from the
  # process env set by model_profiles.profile_env (OpenAI, the desktop's Ollama).
  gpt-4o-mini:
    backend: openai
    model: gpt-4o-mini
    json_mode: json_object
    timeout_s: 60
  qwen2.5:7b-instruct:
    backend: openai
    model: qwen2.5:7b-instruct
    json_mode: json_object
    timeout_s: 120
  # Owner decision 2026-09-29 (evening): Llama-3.1-8B runs on the desktop's Ollama (the
  # OpenRouter entry was removed). Local like Qwen, so the same timeout.
  llama3.1:8b:
    backend: openai
    model: llama3.1:8b
    json_mode: json_object
    timeout_s: 120
  # The full-cloud route of the v2 benchmark (task 7.29, ADR-0014, owner decision 2026-10-01): the
  # same two models through OpenRouter with ONE provider pinned and fallbacks off. `provider_routing` is OpenRouter's
  # `provider` request object and must equal the model profile's (a test checks it);
  # `response_metadata` makes the guard's provider expose which provider served each call, which
  # rag-email's CountingProvider records and checks against this pin. Base URL and key come from
  # the process env like the other entries. json_mode stays json_object: the guard's schemas are
  # not strict-schema compatible, and the pin's require_parameters keeps the call on an endpoint
  # that supports response_format.
  qwen/qwen-2.5-7b-instruct:
    backend: openai
    model: qwen/qwen-2.5-7b-instruct
    json_mode: json_object
    timeout_s: 120
    provider_routing:
      order: [phala]
      allow_fallbacks: false
      require_parameters: true
    response_metadata: true
  meta-llama/llama-3.1-8b-instruct:
    backend: openai
    model: meta-llama/llama-3.1-8b-instruct
    json_mode: json_object
    timeout_s: 120
    provider_routing:
      order: [coreweave]
      allow_fallbacks: false
      require_parameters: true
      quantizations: [bf16]
    response_metadata: true
