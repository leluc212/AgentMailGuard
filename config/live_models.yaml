# Live models the demo console can pick from (task 9.16, ADR-0019, R25.4).
#
# Demo catalog. Llama-3.1-8B keeps the endpoint, pin and prices of the benchmark's profile in
# evaluation/mailguard_bench/model_profiles.py (that module stays the benchmark's and is
# unchanged). Removed from the console: gpt-4o-mini (needs a direct OpenAI key; the LLM__* stack
# model already serves it through OpenRouter) and qwen2.5-7b-openrouter (OpenRouter withdrew
# qwen/qwen-2.5-7b-instruct, every call returns HTTP 404). A model is offered when its key
# variable is set in the container's environment. Keys are never written here.
#
# The LLM__* provider (if LLM__PROVIDER is not fake) stays the default live model of jobs that
# name none, as before ADR-0019.
version: 1

models:
  - name: llama-3.1-8b-openrouter
    label: "Llama-3.1-8B (OpenRouter · CoreWeave bf16)"
    model: meta-llama/llama-3.1-8b-instruct
    base_url: https://openrouter.ai/api/v1
    api_key_env: DEMO_OPENROUTER_API_KEY
    input_per_m: 0.22
    output_per_m: 0.22
    provider_routing:
      {order: [coreweave], allow_fallbacks: false, require_parameters: true, quantizations: [bf16]}

  # Demo-only entry, replaces the withdrawn Qwen2.5-7B. No provider pin: OpenRouter picks the
  # serving provider.
  - name: qwen3.5-9b-openrouter
    label: "Qwen3.5-9B (OpenRouter)"
    model: qwen/qwen3.5-9b
    base_url: https://openrouter.ai/api/v1
    api_key_env: DEMO_OPENROUTER_API_KEY
    input_per_m: 0.10
    output_per_m: 0.25
