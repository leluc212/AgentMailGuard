[project]
name = "agentmailguard"
version = "0.1.0"
description = "AgentMailGuard: multi-layer prompt-injection defence for RAG-based email assistants"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AgentMailGuard Security Team" }]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Fine-tuning / transformer baselines (Qwen2.5-7B, Llama-3.1-8B, Prompt Guard 2, ProtectAI)
ml = [
    "torch>=2.2",
    "transformers>=4.44",
    "peft>=0.12",
    "datasets>=2.20",
    "accelerate>=0.33",
    "bitsandbytes>=0.43; sys_platform == 'linux'",
]
# Dataset download / benchmark tooling
eval = [
    "datasets>=2.20",
    "pandas>=2.2",
    "huggingface-hub>=0.24",
    "tqdm>=4.66",
    "pyarrow>=15",
]
# Runtime integration with the rag-email core (RabbitMQ worker + Prometheus)
runtime = [
    "aio-pika>=9.4",
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mailguard", "services"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".venv", "__pycache__", "build", "dist", "datasets/raw", "datasets/processed"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["SIM115"]

[tool.ruff.lint.per-file-ignores]
"mailguard/datasets/sources.py" = ["E501"]
"evaluation/attacks/taxonomy.py" = ["E501"]
"tests/**" = ["E501"]
"mailguard/datasets/build_*.py" = ["E501"]
"evaluation/*.py" = ["E501"]
"training/*.py" = ["E501"]
"services/**" = ["E501"]
"scripts/**" = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
